# Project information
site_name: Iceland ML Course Docs

# Configuration
theme:
  name: material
  palette:
    scheme: iceland
  font:
    text: Source Sans 3
    code: DM Mono
  logo: assets/computer.png
  favicon: assets/computer.png
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
